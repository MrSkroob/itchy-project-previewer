<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <link
        rel="stylesheet"
        href="{{CSS_URI}}"
    >
</head>

<body>
    <div id="editor">
        <div id="stage-pane" class="editor-group">
            <div id="stage-container">
                <!-- this is filled in by stage.ts -->
                 <canvas 
                    id="stage-canvas"
                    width="480"
                    height="360"
                >
                </canvas>
                <div class="variable-monitor-layer">
                    <div class="variable-monitor">
                        <label class="monitor-name">Variable</label>
                        <label class="monitor-value">100</label>
                    </div>

                    <div class="list-monitor">
                        <label class="monitor-name">do you want</label>
                        <ul class="monitor-list-entries">one dollar</ul>
                        <ul class="monitor-list-entries">two dollar</ul>
                    </div>
                </div>
            </div>

        </div>

        <!-- <template id="speech-bubble">
            
        </template> -->

        <template id="copy-button-template">
            <button
                    class="copy-button"
                    type="button"
                    aria-label="Copy value"
                >
                    <svg viewBox="0 0 16 16" width="16" height="16">
                        <path
                            fill="currentColor"
                            d="M4 4V1h11v11h-3v3H1V4h3zm1 0h7v7h2V2H5v2zm6 1H2v9h9V5z"
                        />
                    </svg>
                </button>
        </template>
        
        <template id="property-input-template">
            <label class="property">
                <span class="property-name"></span>
                <span class="property-input">

                </span>
            </label>
        </template>

        <template id="variable-toggle">
            <label></label>
            <input type="checkbox">
        </template>

        <div id="sprite-editor">
            <div id="sprite-properties" class="editor-group">
                <!-- this is filled in by stage.ts -->
            </div>

            <div id="code-template" class="editor-group">
                <span id="text-contents" class="text">
                </span>
            </div>
        </div>
    </div>
    <!-- <div id="monitors" class="editor-group">
        <div>
            <span class="property-name">variable</span>
            <span class="property-input">
                <input type="checkbox">
            </span>
        </div>
    </div> -->
    
    <script src="{{JS_URI}}"></script>
</body>
</html>
